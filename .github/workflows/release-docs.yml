name: Release User Guide

# Normally called by the promotion workflow after it tags a merge to main.
# A v* tag pushed by an admin also runs it directly.

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish
        type: string
        required: true

permissions:
  contents: write # needed to create the release and upload the PDF

jobs:
  docs:
    runs-on: ubuntu-latest
    container: ghcr.io/chiselware/dev-full:0.10.1
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify certified tags
        run: |
          case "$TAG" in
            v0.*) exit 0 ;;   # pre-certification: no rules
          esac
          git merge-base --is-ancestor "$TAG" origin/main \
            || { echo "Certified tag must be on main"; exit 1; }
          VERSION=$(sed -n 's/^## \[\{0,1\}\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CHANGELOG.md | head -1)
          [ "$TAG" = "v$VERSION" ] \
            || { echo "Tag $TAG does not match CHANGELOG version $VERSION"; exit 1; }

      - name: Build user guide
        run: make pdf

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          pdfs=(modules/*/docs/user-guide/*.pdf)
          [ ${#pdfs[@]} -gt 0 ] || { echo "No user guide PDF found"; exit 1; }
          # create, or on a re-run replace the assets of the existing release
          gh release create "$TAG" "${pdfs[@]}" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            || gh release upload "$TAG" "${pdfs[@]}" --clobber
