name: Release User Guide

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # needed to create the release and upload the PDF

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so git describe gives the tag

      - name: Verify certified tags
        run: |
          case "$GITHUB_REF_NAME" in
            v0.*) exit 0 ;;   # pre-certification: no rules
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "Certified tag must be on main"; exit 1; }
          VERSION=$(sed -n 's/^## \[\{0,1\}\([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' CHANGELOG.md | head -1)
          [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
            || { echo "Tag $GITHUB_REF_NAME does not match CHANGELOG version $VERSION"; exit 1; }

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended latexmk

      - name: Build user guide
        run: make pdf

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          pdfs=(modules/*/docs/user-guide/*.pdf)
          [ ${#pdfs[@]} -gt 0 ] || { echo "No user guide PDF found"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "${pdfs[@]}" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes
