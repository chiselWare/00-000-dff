rules = [ 
  OrganizeImports
  DisableSyntax
  ExplicitResultTypes
  chisel-002
  scala-007
  scala-009
  scala-010
  scala-011
  scala-027
  scala-029
]

# Example of a patch to allow a new callee
#scala-027 {
#  allowlistedCallees = ["ChiselStage"]
#}

# CHISEL-002: no wildcard imports of non-DSL packages in Chisel sources
chisel-002 {
  allowedWildcardPackages = ["chisel3", "chisel3.util", "chiseltest"]
}

OrganizeImports {
  removeUnused = true
  groupedImports = Merge

 # chiselWare CHISEL-002: DSL preludes (chisel3._, chiseltest._) first,
  # blank line, then all other imports sorted together
  groups = [
    "re:^(chisel3|chiseltest)(\\._)?$"
    "*"
  ]
  blankLines = Auto
  coalesceToWildcardImportThreshold = null
}

ExplicitResultTypes {
  memberKind = [Def]
  memberVisibility = [Public, Protected, Private]
  skipSimpleDefinitions = false
}

DisableSyntax {
  noVars = true
  noReturns = true
  noNulls = true
}
