rules = [ 
  OrganizeImports
  DisableSyntax
  ExplicitResultTypes 
  scala-007
  scala-009
  scala-010
  scala-011
  scala-027
  scala-029
]

# Example of a patch to allow a new callee
#scala-027 {
#  allowlistedCallees = ["ChiselStage"]
#}

OrganizeImports {
  removeUnused = true
  groupedImports = Merge

# chiselWare CHISEL-002: DSL preludes (chisel3._, chiseltest._) first,
# blank line, then all other imports sorted together
  groups = [
    "re:^(chisel3|chiseltest)(\\._)?$"
    "*"
  ]
  blankLines = Auto
  coalesceToWildcardImportThreshold = null
}

ExplicitResultTypes {
  memberKind = [Def]
  memberVisibility = [Public, Protected, Private]
  skipSimpleDefinitions = false
}

DisableSyntax {
  noVars = true
  noReturns = true
  noNulls = true
  regex = [
    {
      id = "noWildcardImports"
      pattern = "(?m)^\\s*import\\s+(?!(chisel3|chiseltest)\\._\\s*$)[\\w.]+\\._\\s*$"
      message = "Wildcard imports are allowed only for DSL preludes (chisel3._, chiseltest._). See chiselWare CHISEL-002."
    }
  ]
}
